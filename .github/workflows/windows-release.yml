name: Windows Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 2026.1.27)'
        required: true
        type: string

jobs:
  build-windows-msi:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          check-latest: true

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate
          pnpm -v

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset -y --version 3.11.2
          $env:PATH = "C:\Program Files (x86)\WiX Toolset v3.11\bin;$env:PATH"
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts=false

      - name: Build project
        run: |
          pnpm canvas:a2ui:bundle
          pnpm build

      - name: Get version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $version = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.event.release.tag_name }}" -ne "") {
            $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          } else {
            $packageJson = Get-Content package.json | ConvertFrom-Json
            $version = $packageJson.version
          }
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "Building version: $version"

      - name: Create batch wrappers
        shell: pwsh
        run: |
          # Create moltbot.bat wrapper
          @"
          @echo off
          setlocal
          set "MOLTBOT_HOME=%~dp0"
          node "%MOLTBOT_HOME%dist\index.js" %*
          "@ | Out-File -FilePath "dist\moltbot.bat" -Encoding ASCII
          
          # Create clawdbot.bat wrapper (alias)
          @"
          @echo off
          setlocal
          set "MOLTBOT_HOME=%~dp0"
          node "%MOLTBOT_HOME%dist\index.js" %*
          "@ | Out-File -FilePath "dist\clawdbot.bat" -Encoding ASCII

      - name: Build MSI
        shell: pwsh
        env:
          WIX: 'C:\Program Files (x86)\WiX Toolset v3.11'
        run: |
          .\scripts\package-windows-msi.ps1 -Version "${{ steps.version.outputs.VERSION }}"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: moltbot-windows-msi
          path: dist/Moltbot-${{ steps.version.outputs.VERSION }}.msi
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/Moltbot-${{ steps.version.outputs.VERSION }}.msi
          asset_name: Moltbot-${{ steps.version.outputs.VERSION }}.msi
          asset_content_type: application/octet-stream

      - name: Generate installation instructions
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          @"
          # Moltbot Windows MSI Installation
          
          ## Download
          Download the MSI installer from the release page or directly:
          https://github.com/${{ github.repository }}/releases/download/v${version}/Moltbot-${version}.msi
          
          ## Install
          
          ### GUI Installation
          Double-click the MSI file and follow the installation wizard.
          
          ### Silent Installation
          ```powershell
          msiexec /i Moltbot-${version}.msi /qn
          ```
          
          ### With Logging
          ```powershell
          msiexec /i Moltbot-${version}.msi /l*v install.log /qb
          ```
          
          ## Verify Installation
          ```powershell
          moltbot --version
          ```
          
          ## Uninstall
          ```powershell
          msiexec /x Moltbot-${version}.msi /qn
          ```
          
          Or via Settings > Apps > Installed apps > Moltbot
          "@ | Out-File -FilePath "dist/INSTALL-WINDOWS.md" -Encoding UTF8

      - name: Upload installation instructions
        uses: actions/upload-artifact@v4
        with:
          name: windows-installation-instructions
          path: dist/INSTALL-WINDOWS.md
